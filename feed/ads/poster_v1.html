<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../carousel/templates/base.css">
</head>
<body class="bg-cover">
  <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 90px;gap:34px">

    <!-- 상단 무료 배지 -->
    <div style="display:inline-flex;align-items:center;gap:14px;border:1.5px solid rgba(233,185,110,0.55);background:rgba(233,185,110,0.1);color:#E9B96E;font-size:27px;font-weight:600;letter-spacing:0.04em;padding:13px 30px;border-radius:999px">
      무료 · 회원가입 없이 · 30초
    </div>

    <!-- 카드 히어로: 뒷면 2장 + 태양 리빌 -->
    <div style="display:flex;justify-content:center;align-items:flex-end;height:400px;margin:2px 0">
      <img class="card-art" src="../../app/assets/cards/back.webp" style="width:206px;transform:rotate(-15deg) translateY(24px);position:relative;z-index:1" alt="타로 카드 뒷면">
      <img class="card-art" src="../../design/cards/major/19_sun.png" style="width:238px;margin:0 -34px;position:relative;z-index:3;box-shadow:0 30px 80px rgba(0,0,0,0.55),0 0 80px rgba(233,185,110,0.4)" alt="타로 카드">
      <img class="card-art" src="../../app/assets/cards/back.webp" style="width:206px;transform:rotate(15deg) translateY(24px);position:relative;z-index:1" alt="타로 카드 뒷면">
    </div>

    <!-- 헤드라인 -->
    <div class="serif" style="font-size:66px;font-weight:700;line-height:1.4;text-align:center;color:#F6EFE3">
      오늘의 카드 한 장,<br><span style="color:#E9B96E">무료로</span> 뽑아보세요
    </div>

    <!-- 보조문 -->
    <div class="sub" style="font-size:31px;max-width:820px">자정의 공방에서 묘연이가 고른 오늘의 운세<br>연애 · 금전 · 일, 오늘의 흐름을 확인해요</div>

    <!-- CTA 버튼 (디자인 장치) -->
    <div style="display:inline-flex;align-items:center;gap:16px;background:#E9B96E;color:#10142B;font-size:40px;font-weight:700;padding:26px 58px;border-radius:999px;box-shadow:0 14px 40px rgba(233,185,110,0.4);margin-top:6px">
      무료로 카드 뽑기 <span style="font-size:36px">→</span>
    </div>

    <!-- 하단 지역·핸들 -->
    <div style="display:flex;align-items:center;gap:16px;margin-top:10px">
      <img src="../../app/assets/character/myoyeon_profile.png" style="width:56px;height:56px;border-radius:50%;border:2px solid rgba(233,185,110,0.45)" alt="묘연이">
      <div style="font-size:28px;color:rgba(246,239,227,0.82);font-weight:500">안산 타로공방 <b style="color:#E9B96E">묘연</b> · @myoyeon.tarot</div>
    </div>

  </div>
</body>
</html>
