<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../carousel/templates/base.css">
<style>
  /* v2 9:16 — 예약 직행 소재 (스토리/릴스). 위·아래 ~250px는 인스타 UI 안전영역 */
  body {
    width: 1080px; height: 1920px;
    background: radial-gradient(125% 80% at 50% 8%, #1F2547 0%, #141A34 45%, #0C0F22 100%);
  }
  .frame {
    position: absolute; inset: 46px;
    border: 2px solid rgba(233,185,110,0.5);
    border-radius: 26px;
    box-shadow: inset 0 0 60px rgba(233,185,110,0.06);
  }
  .frame::before {
    content: ""; position: absolute; inset: 12px;
    border: 1px solid rgba(233,185,110,0.22); border-radius: 18px;
  }
  .moonglow {
    position: absolute; top: 240px; left: 50%; transform: translateX(-50%);
    width: 660px; height: 660px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(233,185,110,0.16), transparent 72%);
    pointer-events: none;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 10px;
    border: 1.5px solid rgba(169,155,214,0.5);
    background: rgba(169,155,214,0.12);
    color: #DCD3F2; font-size: 29px; font-weight: 600;
    padding: 15px 28px; border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="moonglow"></div>

  <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:260px 100px;gap:30px">

    <!-- 지역 배지 -->
    <div style="display:inline-flex;align-items:center;gap:12px;border:1.5px solid rgba(233,185,110,0.6);background:rgba(233,185,110,0.12);color:#E9B96E;font-size:30px;font-weight:700;letter-spacing:0.03em;padding:15px 34px;border-radius:999px">
      📍 안산 오프라인 타로공방
    </div>

    <!-- 묘연이 메달리온 -->
    <img src="../../app/assets/character/myoyeon_main.png"
         style="width:210px;height:210px;object-fit:cover;border-radius:50%;border:3px solid rgba(233,185,110,0.55);box-shadow:0 0 80px rgba(233,185,110,0.32),0 14px 36px rgba(0,0,0,0.5)" alt="묘연이">

    <!-- 오퍼 -->
    <div style="font-size:32px;font-weight:700;color:#A99BD6;letter-spacing:0.22em;padding-left:0.22em">오 픈 기 념 이 벤 트 가</div>
    <div class="serif" style="font-size:70px;font-weight:700;color:#F6EFE3;line-height:1.3;text-align:center;margin-top:-8px">1:1 타로리딩</div>
    <div class="serif" style="font-size:148px;font-weight:700;color:#E9B96E;line-height:1.05;text-align:center;text-shadow:0 0 70px rgba(233,185,110,0.35)"><span style="font-size:48px;vertical-align:64px;color:rgba(246,239,227,0.8);margin-right:14px">단돈</span>5,000원</div>

    <!-- 가치 필 -->
    <div style="display:flex;gap:14px;margin-top:8px">
      <span class="pill">⏱ 30분 리딩</span>
      <span class="pill">🔮 1:1 대면</span>
      <span class="pill">📅 예약 30초</span>
    </div>

    <!-- CTA -->
    <div style="display:inline-flex;align-items:center;gap:16px;background:#E9B96E;color:#10142B;font-size:46px;font-weight:700;padding:30px 66px;border-radius:999px;box-shadow:0 14px 46px rgba(233,185,110,0.42);margin-top:16px">
      지금 바로 신청하기 <span style="font-size:42px">→</span>
    </div>
    <div style="font-size:29px;color:rgba(246,239,227,0.62)">원하는 날짜·시간 선택 · 현장 결제</div>

    <!-- 하단 주소·핸들 -->
    <div style="font-size:29px;color:rgba(246,239,227,0.78);margin-top:6px">안산 단원구 광덕대로 168 · <b style="color:#E9B96E">@myoyeon.tarot</b></div>

  </div>
</body>
</html>
